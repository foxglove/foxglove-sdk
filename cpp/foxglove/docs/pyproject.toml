[project]
name = "cpp-sdk-documentation"
version = "0.0.0"
# soupsieve >= 4.0.0 (CVE-2026-126190) requires Python >= 3.11.5.
requires-python = ">=3.11.5"

[dependency-groups]
dev = [
    "breathe>=4.36.0,<5",
    "exhale>=0.3.7,<0.4",
    "furo>=2024.8.6,<2025",
    "sphinx>=7.2.0,<8",
    "sphinxcontrib-jquery>=4.1.0,<5",
]

[tool.uv]
package = false
constraint-dependencies = ["soupsieve>=4.0.0"]
