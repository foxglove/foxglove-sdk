name: Schema stability

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

jobs:
  msg-schema-check:
    name: msg-schema-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check for modified or deleted ROS .msg files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HAS_OVERRIDE: ${{ contains(github.event.pull_request.labels.*.name, 'breaking:msg-schema') }}
        run: |
          set -euo pipefail

          # Pure additions and changes to standalone comments do not alter the
          # message structure. Deletions and renames can break consumers.
          changed=$(git diff --name-status --diff-filter=DR \
            "$BASE_SHA"..."$HEAD_SHA" \
            -- 'schemas/ros1/*.msg' 'schemas/ros2/*.msg')

          while IFS= read -r path; do
            if ! diff -q \
              <(git show "$BASE_SHA:$path" | sed '/^[[:space:]]*#/d; /^[[:space:]]*$/d') \
              <(git show "$HEAD_SHA:$path" | sed '/^[[:space:]]*#/d; /^[[:space:]]*$/d') \
              > /dev/null; then
              changed="${changed}${changed:+$'\n'}"$'M\t'"${path}"
            fi
          done < <(git diff --name-only --diff-filter=M \
            "$BASE_SHA"..."$HEAD_SHA" \
            -- 'schemas/ros1/*.msg' 'schemas/ros2/*.msg')

          if [ -z "$changed" ]; then
            echo "No structural changes to ROS .msg files."
            exit 0
          fi

          {
            echo "## Structural changes to ROS .msg files"
            echo
            echo '```'
            echo "$changed"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$HAS_OVERRIDE" = "true" ]; then
            {
              echo
              echo "Override label \`breaking:msg-schema\` is present — allowing intentional schema break."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "Override label is present; allowing this PR."
            exit 0
          fi

          {
            echo
            echo "This PR changes ROS .msg structure, which can break downstream consumers."
            echo "If this is intentional and approved by reviewers, add the \`breaking:msg-schema\` label to override."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::Structural ROS .msg changes require the 'breaking:msg-schema' label."
          exit 1
