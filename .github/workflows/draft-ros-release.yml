name: Draft ROS Release

on:
  push:
    tags: ["ros-v*"]
  workflow_dispatch:
    inputs:
      use_branch_sdk:
        description: "Build the bridge against the SDK at HEAD (via `make build-cpp-dist`) instead of the released SDK"
        type: boolean
        default: false

jobs:
  # A release tag must match the version stamped into the bridge's startup
  # banner, which comes from CMakeLists.txt; both package.xml files must agree.
  check-version:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check tag against CMakeLists.txt and package.xml
        run: |
          set -euo pipefail

          TAG_VERSION="${GITHUB_REF_NAME#ros-v}"
          CMAKE_VERSION=$(sed -nE 's/^project\(foxglove_bridge .*VERSION ([0-9.]+)\).*/\1/p' ros/src/foxglove_bridge/CMakeLists.txt)
          BRIDGE_VERSION=$(sed -nE 's|.*<version>(.*)</version>.*|\1|p' ros/src/foxglove_bridge/package.xml)
          MSGS_VERSION=$(sed -nE 's|.*<version>(.*)</version>.*|\1|p' ros/src/foxglove_msgs/package.xml)
          echo "tag: ${TAG_VERSION}, CMakeLists.txt: ${CMAKE_VERSION}, foxglove_bridge package.xml: ${BRIDGE_VERSION}, foxglove_msgs package.xml: ${MSGS_VERSION}"

          if [[ "${TAG_VERSION}" != "${CMAKE_VERSION}" || "${TAG_VERSION}" != "${BRIDGE_VERSION}" || "${TAG_VERSION}" != "${MSGS_VERSION}" ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match CMakeLists.txt (${CMAKE_VERSION}) and package.xml (${BRIDGE_VERSION}, ${MSGS_VERSION})"
            exit 1
          fi

  build-cpp-dist:
    # Only needed when overriding the SDK with a branch build; on tag pushes we
    # let FetchContent pull the released SDK.
    if: ${{ inputs.use_branch_sdk }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            # Pinned to 22.04 so libfoxglove.a is compatible with ROS Humble (glibc 2.35)
            runs-on: ubuntu-22.04
          - arch: aarch64
            runs-on: ubuntu-22.04-arm
    runs-on: ${{ matrix.runs-on }}
    name: "build-cpp-dist (${{ matrix.arch }})"
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libglib2.0-dev libva-dev libwebsockets-dev \
            nvidia-cuda-dev
          echo "CUDA_HOME=/usr" >> $GITHUB_ENV
      - uses: ./.github/actions/setup-clang

      - name: Build C++ SDK
        run: make -f Container.mk FOXGLOVE_REQUIRE_CUDA=ON build-cpp-dist

      - name: Upload SDK artifact
        uses: actions/upload-artifact@v7
        with:
          name: cpp-sdk-${{ matrix.arch }}
          path: cpp/dist
          retention-days: 1

  build-deb:
    needs: [check-version, build-cpp-dist]
    # Run when build-cpp-dist succeeded (branch-SDK mode) or was skipped
    # (release-SDK mode), and check-version succeeded (tag push) or was skipped
    # (manual dispatch).
    if: ${{ always() && (needs.check-version.result == 'success' || needs.check-version.result == 'skipped') && (needs.build-cpp-dist.result == 'success' || needs.build-cpp-dist.result == 'skipped') }}
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
        distro: [humble, jazzy, kilted, lyrical, rolling]
        package: [bridge, msgs]
        include:
          - arch: x86_64
            runs-on: ubuntu-22.04
          - arch: aarch64
            runs-on: ubuntu-22.04-arm
    runs-on: ${{ matrix.runs-on }}
    name: "build-deb (${{ matrix.distro }}, ${{ matrix.arch }}, ${{ matrix.package }})"
    steps:
      - uses: actions/checkout@v7

      - name: Download C++ SDK artifact
        if: ${{ inputs.use_branch_sdk && matrix.package == 'bridge' }}
        uses: actions/download-artifact@v8
        with:
          name: cpp-sdk-${{ matrix.arch }}
          path: cpp/dist

      - name: Build .deb
        working-directory: ros
        run: |
          make \
            ${{ (inputs.use_branch_sdk && matrix.package == 'bridge') && 'FOXGLOVE_CPP_SDK_DIR=/sdk/cpp/dist' || '' }} \
            ${{ matrix.distro == 'rolling' && 'EXTRA_DOCKER_ARGS="--build-arg USE_ROS_TESTING=true"' || '' }} \
            docker-deb-${{ matrix.package }}-${{ matrix.distro }}

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v7
        with:
          name: ros-${{ matrix.distro }}-foxglove-${{ matrix.package }}-${{ matrix.arch }}-deb
          path: ros/dist/*.deb
          retention-days: 7

  draft-release:
    needs: [build-deb]
    # `always()` opts out of the default skip-cascade: build-cpp-dist is skipped
    # on tag pushes, and without this the cascade would skip draft-release even
    # though build-deb succeeded.
    if: ${{ always() && github.event_name == 'push' && needs.build-deb.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Download all .deb artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: "ros-*-deb"
          path: debs
          merge-multiple: true

      - name: List debs
        run: find debs -type f -name '*.deb' | sort

      - name: Build release notes from CHANGELOGs
        run: |
          set -euo pipefail
          extract() {
            # Print bullets from the first "X.Y.Z (date)" heading up to (but not
            # including) the second, skipping the heading line and its dashed
            # underline so the rendered markdown matches the prior release style.
            awk '
              /^[0-9]+\.[0-9]+\.[0-9]+ \(/ {
                count++
                if (count == 2) exit
                skip_dashes = 1
                next
              }
              skip_dashes && /^-+$/ { skip_dashes = 0; next }
              count == 1 { print }
            ' "$1"
          }
          {
            echo "## foxglove_bridge"
            extract ros/src/foxglove_bridge/CHANGELOG.rst
            echo
            echo "## foxglove_msgs"
            extract ros/src/foxglove_msgs/CHANGELOG.rst
          } > release-notes.md
          cat release-notes.md

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            debs/*.deb \
            --title "${GITHUB_REF_NAME}" \
            --notes-file release-notes.md \
            --draft

  status:
    name: status
    needs: [check-version, build-cpp-dist, build-deb, draft-release]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
