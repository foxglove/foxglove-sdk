name: Docs

on:
  push:
    branches: [main]
    tags: ["**"]
  pull_request: {}

jobs:
  build-cpp-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ssciwr/doxygen-install@v2
        with:
          version: "1.18.0"
      - uses: astral-sh/setup-uv@v10.1.0
      - run: make docs
        working-directory: cpp
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: cpp
          path: ./cpp/build/docs/html
          if-no-files-found: error

  build-python-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Install common dependencies
        uses: ./.github/actions/common-deps
        with:
          python-version: "3.13"
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn
      - uses: astral-sh/setup-uv@v10.1.0
      - run: make -f Container.mk docs-python
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: python
          path: python/foxglove-sdk/python/docs/_build
          if-no-files-found: error

  prepare-docs:
    runs-on: ubuntu-latest
    needs: [build-cpp-docs, build-python-docs]
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
      - run: test -d artifacts/python
      - run: test -d artifacts/cpp
      - name: Create basic index.html
        run: |
          cat <<EOF > artifacts/index.html
            <ul>
              <li><a href="/python">Python API docs</a></li>
              <li><a href="/cpp">C++ API docs</a></li>
            </ul>
          EOF
      - name: Upload combined docs
        uses: actions/upload-artifact@v7
        with:
          name: docs
          path: artifacts
          if-no-files-found: error

  deploy-docs:
    if: |
      (
        github.event_name == 'pull_request' &&
        !github.event.pull_request.head.repo.fork &&
        github.actor != 'dependabot[bot]'
      ) ||
      startsWith(github.ref, 'refs/tags/sdk/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    needs: [prepare-docs]
    environment:
      name: ${{ startsWith(github.ref, 'refs/tags/sdk/v') && 'foxglove-sdk-api-docs (Production)' || 'foxglove-sdk-api-docs (Preview)' }}
      url: ${{ steps.deploy.outputs.deployment-url }}
    steps:
      - name: Download docs
        uses: actions/download-artifact@v8
        with:
          name: docs
          path: artifacts
      - name: Deploy to CF Pages
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          packageManager: npm
          command: >-
            pages deploy artifacts
            --project-name=foxglove-sdk-api-docs
            --branch=${{ github.head_ref || 'main' }}
