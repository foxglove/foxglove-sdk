[project]
name = "lerobot-to-mcap"
version = "0.0.0"
description = "Convert a LeRobot dataset into MCAP files, one per episode"
authors = [{ name = "Foxglove", email = "support@foxglove.dev" }]
requires-python = ">=3.10"
readme = "README.md"
dependencies = ["foxglove-sdk[lerobot]>=0.28.0"]

[dependency-groups]
dev = ["mypy>=1,<2", "pytest>=8"]

[tool.uv]
package = false
